<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mellow</title>
    <link rel="stylesheet" href="../static/css/style.css" />
    <script src="../static/js/chart.min.js"></script>
    <script src="../static/js/shared-graph.js"></script>
  </head>
  <body class="popup-root">
    <div class="popup-container">
      <div class="popup-header">
        <div class="brand">
          <img class="brand-icon" src="../static/assets/IconDark.png" alt="Mellow icon" />
          <div class="brand-name section-subheader">Mellow</div>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-row">
          <div class="setting-label">Extension Status</div>
          <div class="setting-controls">
            <div class="toggle-switch">
              <input type="checkbox" id="toggle-enabled" />
              <label for="toggle-enabled" aria-label="Enable or disable extension"></label>
            </div>
            <span id="run-status" class="setting-status">Stopped</span>
          </div>
        </div>
      </div>

      <button id="open-dashboard" class="btn btn-full">
        <img class="btn-icon" src="../static/assets/layout.svg" alt="Open dashboard" />
        <span class="btn-text">Open Dashboard</span>
      </button>

      <div class="popup-graph card graph-card">
        <div class="graph-header">
          <div class="graph-title">Level X Time</div>
          <button id="category-pill" class="category-pill" aria-label="Selected category" disabled>All</button>
        </div>
        <canvas id="popupChart" width="560" height="280" aria-label="Activity chart" role="img"></canvas>
      </div>
    </div>
    <script src="../static/js/popup.js" type="module"></script>
    
  </body>
  </html>
